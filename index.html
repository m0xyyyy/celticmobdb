<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M0xy's Celtic Mob Database — The Grimoire</title>
<meta name="description" content="M0xy's Celtic Mob Database — search Celtic Heroes NPCs, combat stats, loot, skills and spawn locations.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="ambient-grid"></div>
<div class="noise-layer"></div>
<div class="cursor-orb" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div>
      <div class="brand-title">M0xy's Celtic Mob Database</div>
      <div class="brand-sub">Celtic Heroes NPC Explorer</div>
    </div>
  </div>
  <div class="top-meta">
    <span id="mobCount">—</span> NPCs indexed
  </div>
</header>

<main class="shell">
  <section class="workspace">
    <aside class="sidebar">
      <div class="search-card">
        <label>Search by name</label>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" autocomplete="off" placeholder="e.g. Gelebron, Snorri, wolf…">
          <button id="clearSearch" title="Clear">×</button>
        </div>
        <div class="id-row">
          <input id="idInput" inputmode="numeric" placeholder="Mob ID">
          <button id="idSearch">ID</button>
        </div>
        <label class="check-label">
          <input type="checkbox" id="autoSearch" checked>
          <span>Auto search</span>
        </label>
      </div>
      <div class="results-head">
        <span>Results</span>
        <span id="resultCount" class="count-pill">0</span>
      </div>
      <div class="results" id="results"></div>
    </aside>

    <section class="content" id="content">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⚔</div>
        <h2>Select an NPC</h2>
        <p>Search by name or ID to open the full combat dossier, loot tables, skills and spawn map.</p>
      </div>
      <div id="dossier" class="hidden"></div>
    </section>
  </section>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <button class="modal-close" data-close>×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
